name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --group dev --extra exporter
      - run: uv run --no-sync pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.0'
          python-version: '3.14'
      - run: uv sync --frozen --group dev --extra exporter
      - run: uv run --no-sync ruff check . .github/image_tags.py
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  image:
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialize publishing so an older release cannot overwrite a newer latest.
    concurrency:
      group: image-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select release tags
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/image_tags.py
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
