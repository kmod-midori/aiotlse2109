[project]
name = "aiotlse2109"
version = "0.1.0"
description = "Async client for TP-Link TL-SE2109 switch status and per-port traffic rates"
readme = "README.md"
authors = [
    { name = "Midori Kochiya", email = "i@reimu.moe" }
]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.11,<4"]

[project.optional-dependencies]
exporter = ["prometheus-client>=0.21,<1"]

[project.scripts]
aiotlse2109-exporter = "aiotlse2109.exporter:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "prometheus-client>=0.21,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
